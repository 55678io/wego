name: Build Windows app

# Every push to main builds the installer and publishes it as a public GitHub Release.
# Permanent download link: https://github.com/55678io/wego/releases/latest/download/Wego-Setup.exe
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Wego-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish public release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Wego ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download and run **Wego-Setup.exe**. No GitHub account needed.
            If Windows shows "Windows protected your PC", click **More info → Run anyway**.
          files: dist/Wego-Setup.exe
