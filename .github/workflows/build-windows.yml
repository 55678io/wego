name: Build Windows app

# Every push builds the Windows installer.
# Pushes to main also publish it as a public GitHub Release (and feed auto-update).
# Permanent download link: https://github.com/55678io/wego/releases/latest/download/Wego-Setup.exe
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build SIP engine
        shell: bash
        run: |
          set +e
          dotnet publish engine/WegoEngine.csproj -c Release -o engine/bin -clp:NoSummary > engine-build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "error|Error" engine-build.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l//[$'\r']/}"; done
            exit $code
          fi
          grep -E "warning CS" engine-build.log | sort -u | head -10 | while IFS= read -r l; do echo "::warning::${l//[$'\r']/}"; done
          grep -iE "Restored|sipsorcery" engine-build.log | head -5
          ls -la engine/bin

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Smoke test engine
        run: node ci/smoke-engine.js

      - name: Set version
        shell: bash
        run: npm version "1.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Measure sizes
        shell: bash
        run: |
          eng=$(du -sm engine/bin | cut -f1)
          unp=$(du -sm dist/win-unpacked | cut -f1)
          loc=$(du -sm dist/win-unpacked/locales | cut -f1)
          res=$(du -sm dist/win-unpacked/resources | cut -f1)
          exe=$(du -sm dist/Wego-Setup.exe | cut -f1)
          files=$(ls -la engine/bin | awk 'NR>1{printf "%s=%dMB ", $9, $5/1048576}')
          echo "::notice::Sizes MB: installer=$exe unpacked=$unp engine=$eng resources=$res locales=$loc | engine files: $files"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Wego-Windows-Installer
          path: |
            dist/Wego-Setup.exe
            dist/latest.yml
          if-no-files-found: error

      - name: Publish public release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Wego v1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download and run **Wego-Setup.exe**. No GitHub account needed.
            If Windows shows "Windows protected your PC", click **More info → Run anyway**.
            Installed copies of Wego update themselves automatically.
          files: |
            dist/Wego-Setup.exe
            dist/Wego-Setup.exe.blockmap
            dist/latest.yml
